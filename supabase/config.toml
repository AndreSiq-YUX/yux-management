# Supabase Configuration for YUX Client Management System

project_id = "portal-yux"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://app.yux.com.br"]
jwt_expiry = 3600

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[db]
port = 54322

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "50MiB"

[functions.receive-channel-event]
verify_jwt = false

[functions.simulate-channel-event]
verify_jwt = true

[functions.process-ai-message]
verify_jwt = true

[functions.dispatch-outbound-message]
verify_jwt = true

[functions.retry-outbound-message]
verify_jwt = true

[functions.request-scheduling]
verify_jwt = true

[functions.submit-webchat-event]
verify_jwt = false

[functions.start-meta-channel-connect]
verify_jwt = true

[functions.complete-meta-channel-connect]
verify_jwt = true

[functions.list-meta-channel-assets]
verify_jwt = true

[functions.disconnect-meta-channel]
verify_jwt = true

[functions.refresh-meta-channel-health]
verify_jwt = true

[functions.send-meta-channel-test]
verify_jwt = true

[functions.start-marketing-provider-connect]
verify_jwt = true

[functions.complete-marketing-provider-connect]
verify_jwt = true

[functions.list-marketing-provider-assets]
verify_jwt = true
