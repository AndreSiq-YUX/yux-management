name: yux-integration

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: yux_test_integration
      POSTGRES_USER: yux_test
      POSTGRES_PASSWORD: yux_test_password
    ports:
      - "127.0.0.1:${YUX_INTEGRATION_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yux_test -d yux_test_integration"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - ./backend/tests/integration/support/postgres-init.sql:/docker-entrypoint-initdb.d/010-yux-compatibility-roles.sql:ro
      - yux_test_postgres_data:/var/lib/postgresql/data
    networks: [yux_test_network]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "yux_test_redis_password"]
    ports:
      - "127.0.0.1:${YUX_INTEGRATION_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "yux_test_redis_password", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - yux_test_redis_data:/data
    networks: [yux_test_network]

networks:
  yux_test_network:
    driver: bridge

volumes:
  yux_test_postgres_data:
  yux_test_redis_data:
