services:
  yux-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_MISSION_FORM_COMPATIBILITY: ${VITE_MISSION_FORM_COMPATIBILITY:-true}
    expose:
      - "80"
    depends_on:
      - yux-backend-api
    restart: unless-stopped

  yux-backend-migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile.dokploy
    command: ["node", "dist/scripts/apply-migrations.js"]
    environment:
      NODE_ENV: production
      MIGRATOR_DATABASE_URL: ${MIGRATOR_DATABASE_URL:?MIGRATOR_DATABASE_URL is required}
      YUX_DATABASE_SERVICE_ROLE: migrator
    depends_on:
      yux-postgres:
        condition: service_healthy
    restart: "no"

  yux-volume-permissions:
    build:
      context: .
      dockerfile: backend/Dockerfile.dokploy
    user: "0:0"
    command:
      - sh
      - -c
      - >-
        mkdir -p
        /app/storage/materials
        /app/storage/omnichannel-attachments
        /app/storage/company-knowledge/.quarantine
        /app/storage/company-knowledge/strategy
        && chown -R 1000:1000
        /app/storage/materials
        /app/storage/omnichannel-attachments
        /app/storage/company-knowledge
    volumes:
      - yux_materials_data:/app/storage/materials
      - yux_omnichannel_attachments_data:/app/storage/omnichannel-attachments
      - yux_company_knowledge_data:/app/storage/company-knowledge
    restart: "no"

  yux-backend-api:
    build:
      context: .
      dockerfile: backend/Dockerfile.dokploy
    expose:
      - "4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${YUX_API_DATABASE_URL:?YUX_API_DATABASE_URL is required}
      YUX_DATABASE_SERVICE_ROLE: api
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@yux-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-yux_session}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://hub.yux.com.br}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://hub.yux.com.br}
      YUX_RELEASE_COMMIT: ${YUX_RELEASE_COMMIT:-unrecorded}
      YUX_RELEASE_MANIFEST_SHA256: ${YUX_RELEASE_MANIFEST_SHA256:-unrecorded}
      YUX_AGENT_RUNTIME_URL: ${YUX_AGENT_RUNTIME_URL:-http://yux-agent-harness-runtime:8080}
      YUX_AGENT_RUNTIME_TOKEN: ${YUX_AGENT_RUNTIME_TOKEN:?YUX_AGENT_RUNTIME_TOKEN is required}
      PROVIDER_SECRET_ENCRYPTION_KEY_B64: ${PROVIDER_SECRET_ENCRYPTION_KEY_B64:?PROVIDER_SECRET_ENCRYPTION_KEY_B64 is required}
      ACTION_ENGINE_MUTATION_LEASE_SECRET: ${ACTION_ENGINE_MUTATION_LEASE_SECRET:?ACTION_ENGINE_MUTATION_LEASE_SECRET is required}
      ACTION_ENGINE_TELEMETRY_REDACTION_KEY: ${ACTION_ENGINE_TELEMETRY_REDACTION_KEY:?ACTION_ENGINE_TELEMETRY_REDACTION_KEY is required}
      MISSION_SUPERVISOR_ENABLED: ${MISSION_SUPERVISOR_ENABLED:-true}
      MISSION_DECISIONS_ENABLED: ${MISSION_DECISIONS_ENABLED:-true}
      MISSION_DECISION_NOTIFICATIONS_ENABLED: ${MISSION_DECISION_NOTIFICATIONS_ENABLED:-true}
      MISSION_SIMULATION_REPORTS_ENABLED: ${MISSION_SIMULATION_REPORTS_ENABLED:-true}
      MISSION_DECISION_FEEDBACK_ENABLED: ${MISSION_DECISION_FEEDBACK_ENABLED:-true}
      MISSION_CONVERSATIONS_ENABLED: ${MISSION_CONVERSATIONS_ENABLED:-false}
      MISSION_CONVERSATIONS_TENANT_ALLOWLIST: ${MISSION_CONVERSATIONS_TENANT_ALLOWLIST:-}
      MISSION_CONVERSATIONS_MAX_TURNS: ${MISSION_CONVERSATIONS_MAX_TURNS:-6}
      MISSION_CONVERSATIONS_POLL_MAX_SECONDS: ${MISSION_CONVERSATIONS_POLL_MAX_SECONDS:-5}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_MARKETING_OAUTH_REDIRECT_URI: ${META_MARKETING_OAUTH_REDIRECT_URI:-}
      META_WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID: ${META_WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID:-}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
      OAUTH_ALLOWED_REDIRECT_URIS: ${OAUTH_ALLOWED_REDIRECT_URIS:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_MARKETING_OAUTH_REDIRECT_URI: ${GOOGLE_MARKETING_OAUTH_REDIRECT_URI:-}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${GOOGLE_ADS_DEVELOPER_TOKEN:-}
      N8N_CRM_WEBHOOK_URL: ${N8N_CRM_WEBHOOK_URL:-}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_ALLOWED_PAID_MODELS: ${OPENROUTER_ALLOWED_PAID_MODELS:-google/gemini-embedding-2}
      OPENROUTER_EMBEDDING_MODEL: ${OPENROUTER_EMBEDDING_MODEL:-google/gemini-embedding-2}
      OPENROUTER_EMBEDDING_DIMENSIONS: ${OPENROUTER_EMBEDDING_DIMENSIONS:-768}
      OPENROUTER_EMBEDDING_TIMEOUT_MS: ${OPENROUTER_EMBEDDING_TIMEOUT_MS:-45000}
      JINA_API_KEY: ${JINA_API_KEY:-}
      KNOWLEDGE_CURATION_ENABLED: ${KNOWLEDGE_CURATION_ENABLED:-true}
      KNOWLEDGE_CURATION_MAX_BATCH_CHARS: ${KNOWLEDGE_CURATION_MAX_BATCH_CHARS:-12000}
      KNOWLEDGE_WEBSITE_MAX_PAGES: ${KNOWLEDGE_WEBSITE_MAX_PAGES:-30}
      SMTP2GO_WEBHOOK_SECRET: ${SMTP2GO_WEBHOOK_SECRET:-}
      MATERIALS_STORAGE_DIR: ${MATERIALS_STORAGE_DIR:-/app/storage/materials}
      OMNICHANNEL_ATTACHMENTS_DIR: ${OMNICHANNEL_ATTACHMENTS_DIR:-/app/storage/omnichannel-attachments}
      OMNICHANNEL_ATTACHMENT_MAX_MB: ${OMNICHANNEL_ATTACHMENT_MAX_MB:-25}
      KNOWLEDGE_STORAGE_DIR: ${KNOWLEDGE_STORAGE_DIR:-/app/storage/company-knowledge}
      STRATEGY_INGESTION_MAX_MB: ${STRATEGY_INGESTION_MAX_MB:-150}
    volumes:
      - yux_materials_data:/app/storage/materials
      - yux_omnichannel_attachments_data:/app/storage/omnichannel-attachments
      - yux_company_knowledge_data:/app/storage/company-knowledge
    depends_on:
      yux-postgres:
        condition: service_healthy
      yux-redis:
        condition: service_started
      yux-agent-harness-runtime:
        condition: service_started
      yux-backend-migrate:
        condition: service_completed_successfully
      yux-volume-permissions:
        condition: service_completed_successfully
    restart: unless-stopped

  yux-backend-worker: &yux-worker-service
    build:
      context: .
      dockerfile: backend/Dockerfile.dokploy
    command: ["node", "dist/src/worker.js"]
    environment: &yux-worker-environment
      NODE_ENV: production
      YUX_WORKER_QUEUE_CLASS: interactive
      YUX_INTERACTIVE_CONCURRENCY: ${YUX_INTERACTIVE_CONCURRENCY:-2}
      YUX_DRAIN_LEGACY_QUEUE: ${YUX_DRAIN_LEGACY_QUEUE:-true}
      YUX_SCHEDULER_ENABLED: "false"
      DATABASE_URL: ${YUX_WORKER_DATABASE_URL:?YUX_WORKER_DATABASE_URL is required}
      YUX_DATABASE_SERVICE_ROLE: worker
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@yux-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://hub.yux.com.br}
      YUX_RELEASE_COMMIT: ${YUX_RELEASE_COMMIT:-unrecorded}
      YUX_RELEASE_MANIFEST_SHA256: ${YUX_RELEASE_MANIFEST_SHA256:-unrecorded}
      YUX_AGENT_RUNTIME_URL: ${YUX_AGENT_RUNTIME_URL:-http://yux-agent-harness-runtime:8080}
      YUX_AGENT_RUNTIME_TOKEN: ${YUX_AGENT_RUNTIME_TOKEN:?YUX_AGENT_RUNTIME_TOKEN is required}
      PROVIDER_SECRET_ENCRYPTION_KEY_B64: ${PROVIDER_SECRET_ENCRYPTION_KEY_B64:?PROVIDER_SECRET_ENCRYPTION_KEY_B64 is required}
      ACTION_ENGINE_MUTATION_LEASE_SECRET: ${ACTION_ENGINE_MUTATION_LEASE_SECRET:?ACTION_ENGINE_MUTATION_LEASE_SECRET is required}
      ACTION_ENGINE_TELEMETRY_REDACTION_KEY: ${ACTION_ENGINE_TELEMETRY_REDACTION_KEY:?ACTION_ENGINE_TELEMETRY_REDACTION_KEY is required}
      MISSION_SUPERVISOR_ENABLED: ${MISSION_SUPERVISOR_ENABLED:-true}
      MISSION_DECISIONS_ENABLED: ${MISSION_DECISIONS_ENABLED:-true}
      MISSION_DECISION_NOTIFICATIONS_ENABLED: ${MISSION_DECISION_NOTIFICATIONS_ENABLED:-true}
      MISSION_SIMULATION_REPORTS_ENABLED: ${MISSION_SIMULATION_REPORTS_ENABLED:-true}
      MISSION_DECISION_FEEDBACK_ENABLED: ${MISSION_DECISION_FEEDBACK_ENABLED:-true}
      MISSION_CONVERSATIONS_ENABLED: ${MISSION_CONVERSATIONS_ENABLED:-false}
      MISSION_CONVERSATIONS_TENANT_ALLOWLIST: ${MISSION_CONVERSATIONS_TENANT_ALLOWLIST:-}
      MISSION_CONVERSATIONS_MAX_TURNS: ${MISSION_CONVERSATIONS_MAX_TURNS:-6}
      MISSION_CONVERSATIONS_POLL_MAX_SECONDS: ${MISSION_CONVERSATIONS_POLL_MAX_SECONDS:-5}
      MISSION_LEARNING_INTERVAL_MS: ${MISSION_LEARNING_INTERVAL_MS:-3600000}
      META_APP_SECRET: ${META_APP_SECRET:-}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-}
      OMNICHANNEL_ATTACHMENTS_DIR: ${OMNICHANNEL_ATTACHMENTS_DIR:-/app/storage/omnichannel-attachments}
      OMNICHANNEL_ATTACHMENT_MAX_MB: ${OMNICHANNEL_ATTACHMENT_MAX_MB:-25}
      KNOWLEDGE_STORAGE_DIR: ${KNOWLEDGE_STORAGE_DIR:-/app/storage/company-knowledge}
      STRATEGY_INGESTION_MAX_MB: ${STRATEGY_INGESTION_MAX_MB:-150}
      N8N_CRM_WEBHOOK_URL: ${N8N_CRM_WEBHOOK_URL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_ALLOWED_PAID_MODELS: ${OPENROUTER_ALLOWED_PAID_MODELS:-google/gemini-embedding-2}
      OPENROUTER_EMBEDDING_MODEL: ${OPENROUTER_EMBEDDING_MODEL:-google/gemini-embedding-2}
      OPENROUTER_EMBEDDING_DIMENSIONS: ${OPENROUTER_EMBEDDING_DIMENSIONS:-768}
      OPENROUTER_EMBEDDING_TIMEOUT_MS: ${OPENROUTER_EMBEDDING_TIMEOUT_MS:-45000}
      JINA_API_KEY: ${JINA_API_KEY:-}
      KNOWLEDGE_CURATION_ENABLED: ${KNOWLEDGE_CURATION_ENABLED:-true}
      KNOWLEDGE_CURATION_MAX_BATCH_CHARS: ${KNOWLEDGE_CURATION_MAX_BATCH_CHARS:-12000}
      KNOWLEDGE_WEBSITE_MAX_PAGES: ${KNOWLEDGE_WEBSITE_MAX_PAGES:-30}
      JINA_REQUEST_TIMEOUT_MS: ${JINA_REQUEST_TIMEOUT_MS:-15000}
    volumes:
      - yux_omnichannel_attachments_data:/app/storage/omnichannel-attachments
      - yux_company_knowledge_data:/app/storage/company-knowledge
    depends_on:
      yux-postgres:
        condition: service_healthy
      yux-redis:
        condition: service_started
      yux-agent-harness-runtime:
        condition: service_started
      yux-backend-migrate:
        condition: service_completed_successfully
      yux-volume-permissions:
        condition: service_completed_successfully
    restart: unless-stopped

  yux-backend-worker-ingestion:
    <<: *yux-worker-service
    environment:
      <<: *yux-worker-environment
      YUX_WORKER_QUEUE_CLASS: ingestion
      YUX_INGESTION_CONCURRENCY: ${YUX_INGESTION_CONCURRENCY:-1}
      YUX_DRAIN_LEGACY_QUEUE: "false"
      YUX_SCHEDULER_ENABLED: "false"

  yux-backend-worker-external:
    <<: *yux-worker-service
    environment:
      <<: *yux-worker-environment
      YUX_WORKER_QUEUE_CLASS: external
      YUX_EXTERNAL_CONCURRENCY: ${YUX_EXTERNAL_CONCURRENCY:-2}
      YUX_DRAIN_LEGACY_QUEUE: "false"
      YUX_SCHEDULER_ENABLED: "false"

  yux-backend-worker-maintenance:
    <<: *yux-worker-service
    environment:
      <<: *yux-worker-environment
      YUX_WORKER_QUEUE_CLASS: maintenance
      YUX_MAINTENANCE_CONCURRENCY: ${YUX_MAINTENANCE_CONCURRENCY:-1}
      YUX_DRAIN_LEGACY_QUEUE: "false"
      YUX_SCHEDULER_ENABLED: "true"

  yux-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yux_hub}
      POSTGRES_USER: ${POSTGRES_USER:-yux_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - yux_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  yux-redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - yux_redis_data:/data
    restart: unless-stopped

  yux-agent-harness-runtime:
    build:
      context: ./workers/marketing-studio-agent-runtime
      dockerfile: Dockerfile
    expose:
      - "8080"
    environment:
      YUX_AGENT_RUNTIME_TOKEN: ${YUX_AGENT_RUNTIME_TOKEN:?YUX_AGENT_RUNTIME_TOKEN is required}
      DATABASE_URL: ${YUX_RUNTIME_DATABASE_URL:?YUX_RUNTIME_DATABASE_URL is required}
      YUX_RELEASE_COMMIT: ${YUX_RELEASE_COMMIT:-unrecorded}
      YUX_RELEASE_MANIFEST_SHA256: ${YUX_RELEASE_MANIFEST_SHA256:-unrecorded}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_ALLOWED_PAID_MODELS: ${OPENROUTER_ALLOWED_PAID_MODELS:-google/gemini-embedding-2}
      OPENROUTER_EMBEDDING_MODEL: ${OPENROUTER_EMBEDDING_MODEL:-google/gemini-embedding-2}
      OPENROUTER_EMBEDDING_DIMENSIONS: ${OPENROUTER_EMBEDDING_DIMENSIONS:-768}
      OPENROUTER_EMBEDDING_TIMEOUT_MS: ${OPENROUTER_EMBEDDING_TIMEOUT_MS:-45000}
      JINA_API_KEY: ${JINA_API_KEY:-}
      KNOWLEDGE_CURATION_MODEL: ${KNOWLEDGE_CURATION_MODEL:-nex-agi/nex-n2.5-mini:free}
      KNOWLEDGE_CURATION_FALLBACK_MODELS: ${KNOWLEDGE_CURATION_FALLBACK_MODELS:-}
    depends_on:
      yux-postgres:
        condition: service_healthy
      yux-backend-migrate:
        condition: service_completed_successfully
      yux-volume-permissions:
        condition: service_completed_successfully
    restart: unless-stopped

x-yux-backup-required-volumes:
  yux_postgres_data: postgres
  yux_redis_data: redis-aof
  yux_materials_data: materials
  yux_omnichannel_attachments_data: omnichannel-attachments
  yux_company_knowledge_data: company-knowledge

volumes:
  # Docker volume labels are immutable. Keep the backup inventory in the
  # extension above so existing production volumes are reused without a
  # destructive recreation prompt during a Compose update.
  yux_postgres_data:
  yux_redis_data:
  yux_materials_data:
  yux_omnichannel_attachments_data:
  yux_company_knowledge_data:
