name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run type-check
      - run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run generate:mission-contracts
      - run: git diff --exit-code -- ../contracts/mission-supervisor src/modules/action-engine/generated
      - run: npm run type-check
      - run: npm test

  agent-runtime:
    name: Agent Runtime
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/marketing-studio-agent-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: workers/marketing-studio-agent-runtime/requirements.txt
      - run: pip install -r requirements.txt
      - run: python scripts/export_mission_contracts.py --check
      - run: python -m pytest tests
      - run: python scripts/run_golden_missions.py --output golden-missions/report.json
