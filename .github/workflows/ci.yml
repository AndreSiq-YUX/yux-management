name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint:baseline
      - run: npm test
      - run: npm run type-check
      - run: npm run build
      - name: Verify reproducible dependency tree and build
        shell: bash
        run: |
          npm ls --all --json > "$RUNNER_TEMP/frontend-dependencies-1.json"
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/frontend-build-1.sha256"
          npm ci
          npm ls --all --json > "$RUNNER_TEMP/frontend-dependencies-2.json"
          npm run build
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/frontend-build-2.sha256"
          diff -u "$RUNNER_TEMP/frontend-dependencies-1.json" "$RUNNER_TEMP/frontend-dependencies-2.json"
          diff -u "$RUNNER_TEMP/frontend-build-1.sha256" "$RUNNER_TEMP/frontend-build-2.sha256"

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run generate:mission-contracts
      - run: npm run generate:platform-contracts
      - run: npm run verify:remediation-release
      - run: git diff --exit-code -- ../contracts/mission-supervisor ../contracts/knowledge ../contracts/workspace src/modules/action-engine/generated src/contracts/generated ../frontend/src/types/generated
      - run: npm run type-check
      - run: npm test
      - run: npm run build
      - name: Verify reproducible dependency tree and build
        shell: bash
        run: |
          npm ls --all --json > "$RUNNER_TEMP/backend-dependencies-1.json"
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/backend-build-1.sha256"
          npm ci
          npm ls --all --json > "$RUNNER_TEMP/backend-dependencies-2.json"
          npm run build
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/backend-build-2.sha256"
          diff -u "$RUNNER_TEMP/backend-dependencies-1.json" "$RUNNER_TEMP/backend-dependencies-2.json"
          diff -u "$RUNNER_TEMP/backend-build-1.sha256" "$RUNNER_TEMP/backend-build-2.sha256"

  backend-integration:
    name: Backend integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Start isolated PostgreSQL and Redis
        run: docker compose --project-name yux-integration -f docker-compose.integration.yml up -d --wait
      - name: Run persistent integration tests
        run: npm run test:integration
        working-directory: backend
        env:
          YUX_INTEGRATION_DATABASE_URL: postgresql://yux_test:yux_test_password@127.0.0.1:55432/yux_test_integration
          YUX_INTEGRATION_REDIS_URL: redis://:yux_test_redis_password@127.0.0.1:56379/0
          YUX_INTEGRATION_COMPOSE_PROJECT: yux-integration
      - name: Capture service logs
        if: failure()
        run: docker compose --project-name yux-integration -f docker-compose.integration.yml logs --no-color > integration-services.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-integration-services
          path: integration-services.log
      - name: Stop isolated services
        if: always()
        run: docker compose --project-name yux-integration -f docker-compose.integration.yml down --volumes --remove-orphans

  agent-runtime:
    name: Agent Runtime
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/marketing-studio-agent-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
          cache: pip
          cache-dependency-path: |
            workers/marketing-studio-agent-runtime/requirements.lock
            workers/marketing-studio-agent-runtime/requirements-dev.lock
            workers/marketing-studio-agent-runtime/requirements-tooling.lock
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip install --require-hashes -r requirements-tooling.lock
      - run: python -m pip check
      - run: python -m pip_audit -r requirements.lock --progress-spinner off
      - run: python scripts/export_mission_contracts.py --check
      - run: python -m pytest tests
      - run: python scripts/run_golden_missions.py --output golden-missions/report.json

  acceptance-journeys:
    name: Acceptance journeys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
          cache: pip
          cache-dependency-path: workers/marketing-studio-agent-runtime/requirements.lock
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: python -m pip install --require-hashes -r requirements.lock
        working-directory: workers/marketing-studio-agent-runtime
      - name: Install Chromium for acceptance journeys
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start isolated PostgreSQL and Redis
        run: docker compose --project-name yux-acceptance -f docker-compose.integration.yml up -d --wait
      - name: Run browser acceptance journeys
        run: npm run test:journeys
        working-directory: frontend
        env:
          CI: 'true'
          YUX_INTEGRATION_DATABASE_URL: postgresql://yux_test:yux_test_password@127.0.0.1:55432/yux_test_integration
          YUX_INTEGRATION_REDIS_URL: redis://:yux_test_redis_password@127.0.0.1:56379/0
          YUX_INTEGRATION_COMPOSE_PROJECT: yux-acceptance
      - name: Capture acceptance service logs
        if: failure()
        run: docker compose --project-name yux-acceptance -f docker-compose.integration.yml logs --no-color > acceptance-services.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yux-acceptance-evidence
          path: |
            frontend/playwright-report
            frontend/test-results
            acceptance-services.log
          if-no-files-found: warn
      - name: Stop isolated services
        if: always()
        run: docker compose --project-name yux-acceptance -f docker-compose.integration.yml down --volumes --remove-orphans

  image-sbom:
    name: Image SBOM (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
            dockerfile: backend/Dockerfile
          - name: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
          - name: agent-runtime
            context: workers/marketing-studio-agent-runtime
            dockerfile: workers/marketing-studio-agent-runtime/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned image
        run: docker build --file "${{ matrix.dockerfile }}" --tag "yux-${{ matrix.name }}:ci" "${{ matrix.context }}"
      - name: Scan runtime image vulnerabilities
        id: image-scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: yux-${{ matrix.name }}:ci
          fail-build: false
          severity-cutoff: high
          output-format: json
          output-file: .grype-${{ matrix.name }}.json
      - name: Reject high-severity runtime image vulnerabilities
        shell: bash
        run: |
          report=".grype-${{ matrix.name }}.json"
          jq -r '
            .matches[]
            | select(.vulnerability.severity == "High" or .vulnerability.severity == "Critical")
            | [
                .vulnerability.severity,
                .vulnerability.id,
                .artifact.name,
                .artifact.version,
                (.vulnerability.fix.versions | join(",") | if length == 0 then "no-fix" else . end)
              ]
            | @tsv
          ' "$report" > "$RUNNER_TEMP/high-vulnerabilities.tsv"

          if [[ -s "$RUNNER_TEMP/high-vulnerabilities.tsv" ]]; then
            while IFS=$'\t' read -r severity vulnerability package installed fixed; do
              echo "::error title=${severity} image vulnerability::${vulnerability} package=${package} installed=${installed} fixed=${fixed}"
            done < "$RUNNER_TEMP/high-vulnerabilities.tsv"
            exit 1
          fi
      - name: Generate image SBOM
        if: always() && steps.image-scan.outcome == 'success'
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: yux-${{ matrix.name }}:ci
          format: cyclonedx-json
          artifact-name: yux-${{ matrix.name }}.cdx.json
          upload-release-assets: false
